<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donation</title>
</head>
<body >

    <h1>Blood Donation Form</h1>
    
    <p>________________________________________________________________________________</p>
    <big>Blood Donor Information </big> <br> <br>
    <form >
        Donor's Name <br>
        <input type="text" placeholder="First"> <input type="text" placeholder="Last"> <br><br>

        Date of Birth <br>
        <input type="date"> <br><br>

        Email <br>
        <input type="text"> <br><br>

        Number <br>
        <input type="number" placeholder="### ### ####"> <br><br>

        Home Address <br>
        <input type="text" placeholder="Street Address"> <br> <br>
        <input type="text" name="home address" placeholder="Street address line- 2 "> <br><br>
        <input type="text" placeholder="City">
        <input type="text" placeholder="Region"> <br><br>
        <input type="text" placeholder="Postel/Zip Code">
        <input type="text" placeholder="Country"> <br><br>

        Occupation <br>
        <input type="text"> <br><br>

        Blood Type <br>
        <input type="text"> <br><br>

        

        <label>Last Donation Date:</label>
        <input type="date" name="lastdonation">
        <br><br>

        <label>Are you feeling healthy today?</label>
        <input type="radio" name="healthy" value="Yes"> Yes
        <input type="radio" name="healthy" value="No"> No
        <br><br>

        <label>Any Medical Problem:</label>
        <br>
        <textarea name="medical" rows="4" cols="30"></textarea>
        <br><br>

        <input type="checkbox" name="agree">
        I confirm that the above information is correct.
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">


        









    </form>



</body>
</html>
