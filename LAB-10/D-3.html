<!DOCTYPE html>
<html>
<head>
    <title>Horizontal Menu</title>

    <style>
        .menu {
            background-color: black;
            padding: 15px;
            text-align: center;
        }

        .menu a {
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            font-size: 18px;
        }

        .menu a:hover {
            background-color: gray;
        }
    </style>
</head>

<body>

    <h2 style="text-align:center;">Horizontal Menu</h2>

    <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Products</a>
        <a href="#">Contact</a>
    </div>

</body>
</html>
