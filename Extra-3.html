<!DOCTYPE html>
<html>
<head>
    <title>Different Shapes</title>

    <style>
        
        .square {
            width: 150px;
            height: 150px;
            background-color: red;
            margin: 20px;
        }

        .rectangle {
            width: 250px;
            height: 120px;
            background-color: blue;
            margin: 20px;
        }

        .circle {
            width: 150px;
            height: 150px;
            background-color: green;
            border-radius: 50%;
            margin: 20px;
        }

        .oval {
            width: 250px;
            height: 120px;
            background-color: orange;
            border-radius: 50%;
            margin: 20px;
        }

        .triangle {
            width: 0;
            height: 0;
            border-left: 75px solid transparent;
            border-right: 75px solid transparent;
            border-bottom: 150px solid purple;
            margin: 20px;
        }

        
    </style>
</head>

<body>

    <h1>Different Shapes Using HTML and CSS</h1>

    <h2>Square</h2>
    <div class="square"></div>

    <h2>Rectangle</h2>
    <div class="rectangle"></div>

    <h2>Circle</h2>
    <div class="circle"></div>

    <h2>Triangle</h2>
    <div class="triangle"></div>
    

</body>
</html>
