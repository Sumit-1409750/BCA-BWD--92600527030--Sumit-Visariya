<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS - Text Properties</title>

    <style>
        h1 {
            color: blue;
            text-align: center;
            text-transform: uppercase;
        }

        p {
            color: green;
            text-align: justify;
            letter-spacing: 2px;
            word-spacing: 5px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
    </style>
</head>

<body>

    <h1>Text Properties</h1>

    <p>
        This paragraph demonstrates different text properties
        using Internal CSS in HTML.
    </p>

</body>
</html>
