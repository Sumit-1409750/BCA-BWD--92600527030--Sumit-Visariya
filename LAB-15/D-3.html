<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Grid Table</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container ">

    <h2 class="text-center mb-4">Student Details</h2>

    <div class="row bg-dark text-white p-2">
        <div class="col-3"><b>ID</b></div>
        <div class="col-3"><b>Name</b></div>
        <div class="col-3"><b>Course</b></div>
        <div class="col-3"><b>Marks</b></div>
    </div>

    <div class="row border p-2">
        <div class="col-3">1</div>
        <div class="col-3">Sumit</div>
        <div class="col-3">BCA</div>
        <div class="col-3">85</div>
    </div>

    <div class="row border p-2">
        <div class="col-3">2</div>
        <div class="col-3">Smeet</div>
        <div class="col-3">BCA</div>
        <div class="col-3">90</div>
    </div>

    <div class="row border p-2">
        <div class="col-3">3</div>
        <div class="col-3">Jayshil</div>
        <div class="col-3">BCA</div>
        <div class="col-3">78</div>
    </div>

</div>

</body>
</html>
