
<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Image Opacity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .my-image {
            width: 800px;
            height: 800px;
            transition: 0.5s;
        }

        .my-image:hover {
            opacity: 0.4;
        }
    </style>
</head>

<body>

    <div class="container text-center mt-5">

        <h2 class="mb-4">Image Opacity Effect</h2>

        <img src="D:\7030 Sumit\BWD\LAB-15\Screenshot (17).png"
             class=" my-image"
             alt="Sample Image">

    </div>

</body>
</html>
